# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file


version: 2

updates:
  # Keep GitHub Actions up to date
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3

    groups:
      github-actions:
        patterns:
          - "*"

  # Monitor C# / NuGet dependencies
  - package-ecosystem: "nuget"
    directory: "/source"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3

    ignore:
      # Playnite controls the SDK compatibility
      - dependency-name: "PlayniteSDK"

      # Avoid major breaking changes
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

      # Legacy WPF controls
      - dependency-name: "LiveCharts"
      - dependency-name: "LiveCharts.Wpf"
      - dependency-name: "VirtualizingWrapPanel"

    groups:
      nuget-patches:
        patterns:
          - "*"
        update-types:
          - "patch"

