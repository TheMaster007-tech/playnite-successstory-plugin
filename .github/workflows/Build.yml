
name: Build and Release SuccessStory

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 3.8.1)"
        required: true
        type: string
      release_notes:
        description: "Optional release notes"
        required: false
        type: string
        default: ""
      publish:
        description: "Publish a GitHub release"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0


      - name: Set extension version
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          $version = $env:RELEASE_VERSION

          if ($version -notmatch '^\d+\.\d+\.\d+(\.\d+)?$') {
            throw "Use a numeric version such as 3.8.1."
          }

          $manifest = "source/extension.yaml"
          $content = Get-Content $manifest -Raw

          if ($content -notmatch '(?m)^Version:') {
            throw "No Version field found in extension.yaml."
          }

          $content = $content -replace `
            '(?m)^Version:.*$', "Version: $version"

          Set-Content $manifest $content -Encoding utf8

          Write-Host "Building version $version"


      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Restore and build
        shell: pwsh
        run: |
          msbuild source/SuccessStory.sln `
            /restore `
            /p:Configuration=Release `
            /p:PostBuildEvent= `
            /m `
            /v:minimal

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }


      - name: Verify build output
        shell: pwsh
        run: |
          $output = "source/bin/Release"

          if (!(Test-Path "$output/SuccessStory.dll")) {
            throw "SuccessStory.dll was not generated."
          }

          Copy-Item "source/extension.yaml" `
            "$output/extension.yaml" -Force

          Get-ChildItem $output

      - name: Download Playnite Toolbox
        shell: pwsh
        run: |
          $release = Invoke-RestMethod `
            -Uri "https://api.github.com/repos/JosefNemec/Playnite/releases/tags/10.62"

          $asset = $release.assets |
            Where-Object { $_.name -eq "10.62.7z" } |
            Select-Object -First 1

          if (!$asset) {
            throw "Playnite portable archive not found."
          }

          $archive = "$env:RUNNER_TEMP/playnite.7z"
          $destination = "$env:RUNNER_TEMP/playnite"

          Invoke-WebRequest `
            -Uri $asset.browser_download_url `
            -OutFile $archive

          & 7z x $archive "-o$destination" -y

          if ($LASTEXITCODE -ne 0) {
            throw "Playnite extraction failed."
          }

          $toolbox = Get-ChildItem $destination `
            -Filter "Toolbox.exe" -Recurse |
            Select-Object -First 1

          if (!$toolbox) {
            throw "Toolbox.exe not found."
          }

          "PLAYNITE_TOOLBOX=$($toolbox.FullName)" |
            Out-File $env:GITHUB_ENV -Append

      - name: Create Playnite installer
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          $output = (Resolve-Path "source/bin/Release").Path

          New-Item -ItemType Directory `
            -Path "artifacts" -Force | Out-Null

          $destination = (Resolve-Path "artifacts").Path

          & $env:PLAYNITE_TOOLBOX pack $output $destination

          if ($LASTEXITCODE -ne 0) {
            throw "Playnite packaging failed."
          }

          $package = Get-ChildItem $destination `
            -Filter "*.pext" |
            Select-Object -First 1

          if (!$package) {
            throw "No .pext package was created."
          }

          $newName = "SuccessStory-$env:RELEASE_VERSION.pext"

          if ($package.Name -ne $newName) {
            Rename-Item $package.FullName $newName
          }

          Get-ChildItem $destination

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: SuccessStory-${{ inputs.version }}
          path: artifacts/*.pext
          if-no-files-found: error
          retention-days: 7

      - name: Generate changelog
        if: inputs.publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          CUSTOM_NOTES: ${{ inputs.release_notes }}
        run: |
          $previousTag = gh release list `
            --limit 1 `
            --json tagName `
            --jq '.[0].tagName'

          $notes = "# SuccessStory $env:RELEASE_VERSION`n"

          if ($env:CUSTOM_NOTES) {
            $notes += "`n$env:CUSTOM_NOTES`n"
          }

          $notes += "`n## Changes`n"

          if ($previousTag) {
            $commits = git log "$previousTag..HEAD" `
              --no-merges --pretty=format:"- %s"
          }
          else {
            $notes += "`nInitial release of this fork.`n"
            $commits = git log -10 `
              --no-merges --pretty=format:"- %s"
          }

          $notes += ($commits -join "`n")

          $notes += "`n`n## Installation`n"
          $notes += "Download the .pext file and open it with Playnite."

          Set-Content release-notes.md $notes -Encoding utf8

      - name: Publish GitHub Release
        if: inputs.publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          $tag = "v$env:RELEASE_VERSION"

          gh release create $tag `
            "artifacts/SuccessStory-$env:RELEASE_VERSION.pext" `
            --title "SuccessStory $env:RELEASE_VERSION" `
            --notes-file release-notes.md `
            --target $env:GITHUB_SHA

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
